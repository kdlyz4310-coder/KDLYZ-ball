<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>粒子碰撞</title>

<style>
body{
    margin:0;
    background:black;
}

canvas{
    display:block;
    margin:auto;
    background:#111;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=400;
canvas.height=600;


// 小球
let balls=[
{
    x:100,
    y:200,
    r:20,
    speedX:4,
    speedY:3,
    color:"cyan"
},

{
    x:300,
    y:400,
    r:20,
    speedX:-3,
    speedY:-4,
    color:"red"
}

];


// 粒子数组
let particles=[];


// 创建粒子
function createParticles(x,y,color){

    for(let i=0;i<25;i++){

        particles.push({

            x:x,
            y:y,

            size:Math.random()*5+2,

            speedX:(Math.random()-0.5)*8,
            speedY:(Math.random()-0.5)*8,

            life:30,

            color:color
        });

    }

}


// 更新粒子
function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];


        p.x+=p.speedX;
        p.y+=p.speedY;

        p.life--;


        if(p.life<=0){
            particles.splice(i,1);
        }

    }

}


// 绘制粒子
function drawParticles(){

    for(let p of particles){

        ctx.globalAlpha=p.life/30;

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha=1;

}


// 画球
function drawBall(ball){

    ctx.fillStyle=ball.color;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();

}


// 更新球
function updateBall(ball){

    ball.x+=ball.speedX;
    ball.y+=ball.speedY;


    if(ball.x+ball.r>canvas.width ||
       ball.x-ball.r<0){

        ball.speedX*=-1;
    }


    if(ball.y+ball.r>canvas.height ||
       ball.y-ball.r<0){

        ball.speedY*=-1;
    }

}


// 碰撞
function checkCollision(){

    let a=balls[0];
    let b=balls[1];


    let dx=a.x-b.x;
    let dy=a.y-b.y;


    let distance=Math.sqrt(dx*dx+dy*dy);


    if(distance<a.r+b.r){

        createParticles(
            (a.x+b.x)/2,
            (a.y+b.y)/2,
            "white"
        );


        a.speedX*=-1;
        a.speedY*=-1;

        b.speedX*=-1;
        b.speedY*=-1;

    }

}


// 游戏循环
function loop(){

    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
    );


    for(let ball of balls){

        updateBall(ball);
        drawBall(ball);

    }


    checkCollision();


    updateParticles();
    drawParticles();


    requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
